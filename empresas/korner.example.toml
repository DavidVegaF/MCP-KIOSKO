# Copiar a empresas/korner.toml. Un archivo por empresa = un conector.
[empresa]
id = "korner"
nombre = "Grupo Comercial Korner"
perfil = "ruta"                       # camionetas -> kioscos

[duckdb]
path = "data/korner/analitica.duckdb"

[server]
host = "127.0.0.1"                    # solo local: lo publica Tailscale Funnel
port = 8101
public_host = "korner.latienditarosa.mx"   # hostname publico del Cloudflare Tunnel (se valida el header Host)
token_env = "MCP_TOKEN_KORNER"        # variable de entorno con el token (NUNCA en este archivo)

[limites]
filas_visibles = 200
filas_sql = 2000

[reglas]
estatus_excluidos = ["C"]             # DOCTOS_VE tipo R: C=cancelada (no cuenta); F=facturada y P=pendiente SI cuentan
almacenes_excluidos = [19]            # 19 = Almacen general: el canal son solo las camionetas
conceptos_devolucion = [7972]         # DOCTOS_IN: devolucion del kiosko a la camioneta (entrada)
conceptos_cambio = [7974]             # DOCTOS_IN: cambios de mercancia / salida a tienda (salida de la camioneta, sin remision)

[etl]
desde = "2024-11-01"                  # las primeras remisiones de ruta son de 2024-11-11
