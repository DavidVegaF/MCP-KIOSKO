# Copiar a empresas/korner.toml. Un archivo por empresa = un conector.
[empresa]
id = "korner"
nombre = "Grupo Comercial Korner"
perfil = "ruta"                       # camionetas -> kioscos

[duckdb]
path = "data/korner/analitica.duckdb"

[server]
host = "127.0.0.1"                    # solo local: lo publica Tailscale Funnel
port = 8101
public_host = "korner.latienditarosa.mx"   # hostname publico del Cloudflare Tunnel (se valida el header Host)
token_env = "MCP_TOKEN_KORNER"        # variable de entorno con el token (NUNCA en este archivo)

[limites]
filas_visibles = 200
filas_sql = 2000

[reglas]
estatus_excluidos = ["C"]             # estatus de DOCTOS_VE que NO cuentan (confirmar con discover_firebird.py)
conceptos_devolucion = [7972]         # DOCTOS_IN: devolucion del kiosko a la camioneta

[etl]
desde = "2025-01-01"                  # fecha inicial de la extraccion
