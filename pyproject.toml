[project]
name = "microsip-mcp"
version = "0.1.0"
description = "MCP remoto (HTTP) de analitica sobre Microsip: copia nocturna en DuckDB, una instancia por empresa"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9,<2",      # la v2 rompio el servidor en el MCP original (fijar <2)
  "duckdb>=1.1",
  "pyarrow>=15",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
etl = ["firebirdsql>=1.3", "openpyxl>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "openpyxl>=3.1"]

[project.scripts]
microsip-mcp = "microsip_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
